<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const params = new URLSearchParams(window.location.search);
            const targetUrl = params.get('to');
            const option = params.get('option'); // optionパラメータの取得

            if (targetUrl) {
                try {
                    const parsedUrl = new URL(targetUrl);
                    if (parsedUrl.protocol === 'http:' || parsedUrl.protocol === 'https:') {
                        
                        // option=newtab が指定されている場合
                        if (option === 'newtab') {
                            const linkBtn = document.getElementById('open-link');
                            linkBtn.href = parsedUrl.href;
                            
                            // 新しいタブを開く（ポップアップブロック対策用のボタン表示）
                            document.getElementById('action-area').style.display = 'block';
                            const newTab = window.open(parsedUrl.href, '_blank', 'noopener,noreferrer');
                            
                            if (newTab) {
                                document.getElementById('status').innerText = '新しいタブで開きました。';
                            } else {
                                document.getElementById('status').innerText = 'ポップアップがブロックされました。下のボタンを押してください。';
                            }
                        } else {
                            // option=newtab がない場合は同一タブでリダイレクト
                            window.location.href = parsedUrl.href;
                        }
                        return;
                    }
                } catch (e) {
                    console.error("Invalid URL format:", e);
                }
            }

            document.getElementById('status').innerText = 'リダイレクト先のURLが指定されていないか、無効です。';
        });
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.6rem 1.2rem;
            background-color: #0066cc;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>
    <div class="container">
        <p id="status">リダイレクト中...</p>
        <div id="action-area" style="display: none;">
            <a id="open-link" class="btn" target="_blank" rel="noopener noreferrer">新しいタブで開く</a>
        </div>
    </div>
</body>
</html>
